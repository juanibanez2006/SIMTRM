name: Calidad SIMTRM

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTO_SYNC_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias Python
        run: python -m pip install -r backend/requirements.lock
      - name: Compatibilidad y Ruff
        run: |
          python -m pip check
          python -m ruff check backend
      - name: Pruebas backend sin fuente externa
        run: python -m pytest backend/tests -q
      - name: Dependencias frontend
        run: npm ci
        working-directory: frontend
      - name: ESLint, pruebas, TypeScript y compilación
        run: |
          npm run lint
          npm test
          npm run build
        working-directory: frontend
